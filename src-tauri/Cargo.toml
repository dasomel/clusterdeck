[package]
name = "clusterdeck"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "clusterdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["process", "sync", "macros", "rt-multi-thread"] }
thiserror = "2.0"
