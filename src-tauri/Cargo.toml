[package]
name = "clusterdeck"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "clusterdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["process", "sync", "macros", "rt-multi-thread", "time"] }
thiserror = "2.0"
async-trait = "0.1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
base64 = "0.22"
sha2 = "0.11"
sha1 = "0.10"

[dev-dependencies]
# test-util (start_paused) lets the password-mode timeout test prove the timeout fires without
# a real 30s wait; Cargo unions this into the main tokio dependency for test builds only.
tokio = { version = "1.38", features = ["test-util"] }
